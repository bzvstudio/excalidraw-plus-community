name: Image

on:
  pull_request:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TRIVY_VERSION: 0.75.0

jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            trivy-asset: Linux-64bit
            trivy-sha256: c6e65abddb348e25f10549df887045629cf28cc72453cd1c63acb717316b3f3f
          - runner: ubuntu-24.04-arm
            trivy-asset: Linux-ARM64
            trivy-sha256: a1ee9f6ffb7d112b64ff726a2a0717c21175c1114361391f4a132956751a13b3
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        if: hashFiles('e2e/image-smoke.ts') != ''
        with:
          node-version-file: package.json
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - name: Build the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          load: true
          tags: excalidraw-plus-community-edition:ci
          cache-from: type=gha,scope=${{ runner.arch }}
          cache-to: type=gha,scope=${{ runner.arch }},mode=max
      - name: Install Trivy, verified against its pinned checksum
        env:
          TRIVY_ASSET: ${{ matrix.trivy-asset }}
          TRIVY_SHA256: ${{ matrix.trivy-sha256 }}
        run: |
          curl -sSfL -o trivy.tar.gz "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_${TRIVY_ASSET}.tar.gz"
          echo "${TRIVY_SHA256}  trivy.tar.gz" | sha256sum --check
          tar -xzf trivy.tar.gz trivy
          sudo mv trivy /usr/local/bin/trivy
      - name: Refuse critical vulnerabilities in the image
        run: trivy image --exit-code 1 --severity CRITICAL --ignore-unfixed --no-progress excalidraw-plus-community-edition:ci
      - name: Refuse critical vulnerabilities in the bundled dependencies
        if: runner.arch == 'X64'
        run: trivy fs --exit-code 1 --severity CRITICAL --ignore-unfixed --scanners vuln --no-progress pnpm-lock.yaml
      - name: Run the image the way a deployment does
        if: hashFiles('e2e/image-smoke.ts') != ''
        run: node e2e/image-smoke.ts excalidraw-plus-community-edition:ci

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Refuse a tag that is not on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
      - name: Build for amd64 and arm64, and publish
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: |
            type=gha,scope=X64
            type=gha,scope=ARM64
          provenance: mode=max
          sbom: true
